<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      Cách 1: Sử dụng đường dẫn hình ảnh từ đường link online (Unsplash)
      Thuộc tính alt giúp mô tả nội dung ảnh nếu ảnh bị lỗi không tải được.
    -->
    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600" 
         alt="Bức tranh nghệ thuật hoa hướng dương màu vàng rực rỡ" 
         width="500">

    <!-- 
      Cách 2: Nếu bạn dùng ảnh lưu sẵn trong thư mục dự án (ví dụ file anh-dep.jpg)
      <img src="anh-dep.jpg" alt="Mô tả bức ảnh của bạn" width="500">
    -->

</body>
</html>
